<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | SHOPME</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navRoot"></div>
  <div style="min-height: 80px;"></div>

  <section class="container my-4">
    <h1 class="section-title"><i class="bi bi-grid me-1"></i> All Products</h1>
    <div class="row g-3 mt-3">
      <div class="col-md-4">
        <input type="search" id="searchInput" class="form-control" placeholder="Search products...">
      </div>
      <div class="col-md-3">
        <select id="filterCategory" class="form-select">
          <option value="all">All Categories</option>
        </select>
      </div>
      <div class="col-md-3">
        <select id="filterShop" class="form-select">
          <option value="all">All Shops</option>
        </select>
      </div>
      <div class="col-md-2">
        <button id="applyFilters" class="btn btn-primary w-100"><i class="bi bi-funnel"></i> Filter</button>
      </div>
    </div>
  </section>

  <section class="container my-4">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="productsGrid"></div>
  </section>

  <div id="footerRoot"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
