<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | SHOPME</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navRoot"></div>
  <div style="min-height: 80px;"></div>

  <section class="container my-4">
    <h1 class="section-title"><i class="bi bi-envelope me-1"></i> Contact Us</h1>
    <div class="row g-4 mt-3">
      <div class="col-lg-6">
        <form id="contactForm" class="needs-validation" novalidate>
          <div class="mb-3">
            <label for="contactName" class="form-label">Name</label>
            <input type="text" class="form-control" id="contactName" required minlength="2">
          </div>
          <div class="mb-3">
            <label for="contactEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="contactEmail" required>
          </div>
          <div class="mb-3">
            <label for="contactMessage" class="form-label">Message</label>
            <textarea class="form-control" id="contactMessage" rows="5" required minlength="10"></textarea>
          </div>
          <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i> Send Message</button>
          <div id="contactSuccess" class="alert alert-success mt-3 d-none">Thank you! We'll get back to you soon.</div>
        </form>
      </div>
      <div class="col-lg-6">
        <div class="card p-4 h-100">
          <h5 class="fw-bold mb-3">Get in Touch</h5>
          <ul class="list-unstyled">
            <li class="mb-3"><i class="bi bi-envelope me-2 text-primary"></i>support@shopme.com</li>
            <li class="mb-3"><i class="bi bi-telephone me-2 text-primary"></i>+1 234 567 8900</li>
            <li class="mb-3"><i class="bi bi-geo-alt me-2 text-primary"></i>123 Shopping Street, City</li>
            <li class="mb-3"><i class="bi bi-clock me-2 text-primary"></i>Mon - Sat: 9AM - 8PM</li>
          </ul>
          <div class="mt-3">
            <h6 class="fw-bold">Follow Us</h6>
            <a href="#" class="text-primary me-3"><i class="bi bi-facebook fs-4"></i></a>
            <a href="#" class="text-primary me-3"><i class="bi bi-twitter-x fs-4"></i></a>
            <a href="#" class="text-primary me-3"><i class="bi bi-instagram fs-4"></i></a>
            <a href="#" class="text-primary"><i class="bi bi-youtube fs-4"></i></a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="footerRoot"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
