<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | SHOPME</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navRoot"></div>
  <div style="min-height: 80px;"></div>

  <section class="container my-4">
    <h1 class="section-title"><i class="bi bi-cart3 me-1"></i> Shopping Cart</h1>
    <div id="cartEmpty" class="text-center py-5">
      <i class="bi bi-cart-x" style="font-size: 4rem; color: #ccc;"></i>
      <h4 class="text-muted mt-3">Your cart is empty</h4>
      <a href="products.html" class="btn btn-primary mt-3"><i class="bi bi-arrow-left me-1"></i> Continue Shopping</a>
    </div>
    <div id="cartContent" class="row g-4 d-none">
      <div class="col-lg-8">
        <div id="cartItems"></div>
      </div>
      <div class="col-lg-4">
        <div class="card p-4 sticky-top">
          <h5 class="fw-bold mb-3">Order Summary</h5>
          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal</span>
            <span id="cartSubtotal">$0.00</span>
          </div>
          <div class="d-flex justify-content-between mb-2">
            <span>Shipping</span>
            <span id="cartShipping">$0.00</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between fw-bold fs-5">
            <span>Total</span>
            <span id="cartTotal">$0.00</span>
          </div>
          <button id="checkoutBtn" class="btn btn-primary btn-lg w-100 mt-3"><i class="bi bi-credit-card me-1"></i> Checkout</button>
          <button id="clearCartBtn" class="btn btn-outline-secondary btn-sm w-100 mt-2"><i class="bi bi-trash me-1"></i> Clear Cart</button>
        </div>
      </div>
    </div>
  </section>

  <div id="footerRoot"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
